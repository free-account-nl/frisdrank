<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisdrank & Snacks</title>
    <style>
        :root {
            --portaal-blue: #5BC5F2;
            --dark-blue: #11275E;
            --orange: #E9530E;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
            background-color: var(--portaal-blue);
            color: var(--white);
            padding: 60px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 35px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .category-section {
            margin-top: 45px;
        }

        .category-title {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .card {
            background-color: var(--white);
            color: var(--dark-blue);
            border-top: 5px solid var(--dark-blue);
            border-radius: 4px;
            padding: 25px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 380px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            max-height: 130px;
            object-fit: contain;
            margin-bottom: 20px;
            width: auto;
            max-width: 100%;
            align-self: center;
        }

        .card h2 {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark-blue);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .content {
            font-size: 0.9rem;
            color: #666;
            margin-top: -8px;
            margin-bottom: 15px;
            font-weight: normal;
            min-height: 20px;
        }

        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--orange);
            margin-bottom: 18px;
        }

        .stock {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 4px;
            background-color: #f7f9fa;
            border: 1px solid #e1e8ed;
            display: inline-block;
            width: 100%;
        }

        .uitverkocht {
            color: var(--orange);
            border-color: var(--orange);
        }

        .empty-message {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            padding: 18px;
        }

        @media (max-width: 1100px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Actuele voorraad</h1>
        </header>
        <div id="menu"></div>
    </div>
    <script>
        const BIN_ID = "6a25b47bda38895dfe95ebb6";
		const ACCESS_KEY = "$2a$10$XTlxaz0BQM2Dv6CRY3bVeeCno9MXr8J88y9n3ntngsuWLs0HlBWcC";
        const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        const CATEGORY_LABELS = {
            drinks: "Frisdrank",
            snacks: "Snacks"
        };

        function normaliseerData(record) {
            if (record.drinks || record.snacks) {
                return {
                    drinks: record.drinks || {},
                    snacks: record.snacks || {}
                };
            }

            // Backwards compatible: oude JSON zonder categorieën wordt automatisch als frisdrank gelezen.
            return {
                drinks: record || {},
                snacks: {}
            };
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function haalVoorraadOp() {
            try {
                const response = await fetch(BASE_URL + "/latest", {
                    headers: {
                        "X-Access-Key": ACCESS_KEY
                    }
                });

                const data = await response.json();
                return normaliseerData(data.record || {});

            } catch (err) {
                console.error(err);
                return { drinks: {}, snacks: {} };
            }
        }

        function productCard(p) {
            const out = Number(p.stock || 0) <= 0;

            const prijs = new Intl.NumberFormat('nl-NL', {
                style: 'currency',
                currency: 'EUR'
            }).format(Number(p.price || 0));

            return `
                <div class="card">
                    <img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.name)}">
                    <div>
                        <h2>${escapeHtml(p.name)}</h2>
                        <div class="content">${escapeHtml(p.content || "")}</div>
                        <div class="price">${prijs}</div>
                        ${
                            out
                            ? `<div class="stock uitverkocht">Geen voorraad</div>`
                            : `<div class="stock">Voorraad: ${Number(p.stock || 0)}</div>`
                        }
                    </div>
                </div>
            `;
        }

        async function toonMenu() {
            const products = await haalVoorraadOp();
            const menu = document.getElementById("menu");
            menu.innerHTML = "";

            Object.keys(CATEGORY_LABELS).forEach(category => {
                const items = products[category] || {};
                const cards = Object.keys(items)
                    .sort((a, b) =>
                        (items[a].name || "").localeCompare(
                            items[b].name || "",
                            "nl",
                            { sensitivity: "base" }
                        )
                    )
                    .map(id => productCard(items[id]))
                    .join("");

                menu.innerHTML += `
                    <section class="category-section">
                        <h2 class="category-title">${CATEGORY_LABELS[category]}</h2>
                        ${
                            cards
                            ? `<div class="grid">${cards}</div>`
                            : `<div class="empty-message">Nog geen producten in deze categorie.</div>`
                        }
                    </section>
                `;
            });
        }
        window.onload = toonMenu;
    </script>
</body>
</html>
