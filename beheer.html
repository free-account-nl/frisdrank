<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Voorraadbeheer</title>
	<style>
		:root {
			--portaal-blue: #5BC5F2;
			--dark-blue: #11275E;
			--orange: #E9530E;
			--white: #FFFFFF;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
			background-color: var(--portaal-blue);
			color: var(--white);
			padding: 60px 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.admin-box {
			width: 100%;
			max-width: 760px;
		}

		h1 {
			font-size: 2.8rem;
			font-weight: 300;
			margin-bottom: 30px;
		}

		.beheer-container {
			background-color: var(--white);
			color: var(--dark-blue);
			padding: 10px 30px;
			border-radius: 4px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
			margin-bottom: 40px;
		}

		.row {
			display: grid;
			grid-template-columns: 1fr 170px 110px;
			gap: 25px;
			align-items: center;
			padding: 25px 0;
			border-bottom: 1px solid #e1e8ed;
		}

		.row:last-child {
			border-bottom: none;
		}

		.product-fields {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.input-name {
			font-size: 1.2rem;
			font-weight: bold;
			color: var(--dark-blue);
		}

		.input-content,
		.input-url,
		.input-price {
			font-size: 1rem;
		}

		input {
			width: 100%;
			padding: 7px 9px;
			border: 1px solid #cfd8e3;
			border-radius: 4px;
			font-family: inherit;
		}

		.input-content {
			max-width: 120px;
		}

		.input-url {
			font-size: 0.85rem;
			color: #555;
		}

		.stock-controls {
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: 150px;
		}

		.btn-calc {
			background-color: var(--dark-blue);
			color: var(--white);
			border: none;
			width: 40px;
			height: 40px;
			min-width: 40px;
			min-height: 40px;
			border-radius: 50%;
			font-size: 1.4rem;
			font-weight: bold;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
		}

		.stock-num {
			font-size: 1.4rem;
			font-weight: bold;
			min-width: 35px;
			text-align: center;
		}

		.price-control {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 1.1rem;
		}

		.input-price {
			width: 80px;
			text-align: center;
		}

		.nav-btn {
			color: var(--white);
			text-decoration: none;
			font-size: 1.1rem;
			font-weight: 300;
			border: 1px solid var(--white);
			padding: 12px 28px;
			display: inline-block;
		}

		.nav-btn:hover {
			background-color: var(--white);
			color: var(--portaal-blue);
		}

		@media (max-width: 700px) {
			.row {
				grid-template-columns: 1fr;
			}

			.stock-controls {
				width: 150px;
			}
		}
	</style>
</head>
<body>
	<div class="admin-box">
		<h1>Voorraadbeheer</h1>
		<div class="beheer-container" id="beheer-lijst"></div>
		<a href="index.html" class="nav-btn">← Sluiten en opslaan</a>
	</div>
	<script>
		const BIN_ID = "6a25b47bda38895dfe95ebb6";
		const MASTER_KEY = "$2a$10$eqYsufkzs8q6iPB5R1Jtf.ux0kkigXJRMNuq/kY/SH.Q/ZONJsAde";
		const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

		let products = {};
		let saveTimeout;

		async function haalVoorraadOp() {
			const response = await fetch(BASE_URL + "/latest", {
				headers: {
					"X-Master-Key": MASTER_KEY
				}
			});

			const data = await response.json();
			products = data.record;

			toonBeheer();
		}

		async function slaVoorraadOp() {
			await fetch(BASE_URL, {
				method: "PUT",
				headers: {
					"Content-Type": "application/json",
					"X-Master-Key": MASTER_KEY
				},
				body: JSON.stringify(products)
			});
		}

		function automatischOpslaan() {
			clearTimeout(saveTimeout);
			saveTimeout = setTimeout(slaVoorraadOp, 500);
		}

		function toonBeheer() {
			const lijst = document.getElementById("beheer-lijst");
			lijst.innerHTML = "";

			Object.keys(products).forEach(id => {
				const product = products[id];

				lijst.innerHTML += `
					<div class="row">
						<div class="product-fields">
							<input
								class="input-name"
								type="text"
								value="${product.name || ""}"
								placeholder="Naam"
								onchange="wijzigNaam('${id}', this.value)"
							>

							<input
								class="input-content"
								type="text"
								value="${product.content || ""}"
								placeholder="Inhoud"
								onchange="wijzigContent('${id}', this.value)"
							>

							<input
								class="input-url"
								type="text"
								value="${product.img || ""}"
								placeholder="Afbeelding URL"
								onchange="wijzigAfbeelding('${id}', this.value)"
							>
						</div>

						<div class="stock-controls">
							<button class="btn-calc" onclick="wijzigVoorraad('${id}', -1)">-</button>
							<span class="stock-num">${product.stock}</span>
							<button class="btn-calc" onclick="wijzigVoorraad('${id}', 1)">+</button>
						</div>

						<div class="price-control">
							<span>€</span>
							<input
								class="input-price"
								type="number"
								step="0.01"
								min="0"
								value="${product.price || 0}"
								onchange="wijzigPrijs('${id}', this.value)"
							>
						</div>
					</div>
				`;
			});
		}

		function wijzigNaam(id, naam) {
			products[id].name = naam;
			automatischOpslaan();
		}

		function wijzigContent(id, content) {
			products[id].content = content;
			automatischOpslaan();
		}

		function wijzigAfbeelding(id, url) {
			products[id].img = url;
			automatischOpslaan();
		}

		function wijzigPrijs(id, prijs) {
			products[id].price = parseFloat(prijs) || 0;
			automatischOpslaan();
		}

		function wijzigVoorraad(id, getal) {
			const nieuw = products[id].stock + getal;

			if (nieuw < 0) return;

			products[id].stock = nieuw;
			toonBeheer();
			automatischOpslaan();
		}

		window.onload = haalVoorraadOp;
	</script>
</body>
</html>
