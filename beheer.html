<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Voorraadbeheer</title>
	<style>
		:root {
			--portaal-blue: #5BC5F2;
			--dark-blue: #11275E;
			--orange: #E9530E;
			--white: #FFFFFF;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
			background-color: var(--portaal-blue);
			color: var(--white);
			padding: 60px 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.admin-box {
			width: 100%;
			max-width: 860px;
		}

		h1 {
			font-size: 2.8rem;
			font-weight: 300;
			margin-bottom: 30px;
		}

		.category-block {
			margin-bottom: 35px;
		}

		.category-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 15px;
			margin-bottom: 12px;
		}

		.category-header h2 {
			font-size: 1.7rem;
			font-weight: 300;
		}

		.beheer-container {
			background-color: var(--white);
			color: var(--dark-blue);
			padding: 10px 30px;
			border-radius: 4px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
		}

		.row {
			display: grid;
			grid-template-columns: 1fr 170px 110px 44px;
			gap: 25px;
			align-items: center;
			padding: 25px 0;
			border-bottom: 1px solid #e1e8ed;
		}

		.row:last-child {
			border-bottom: none;
		}

		.product-fields {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.input-name {
			font-size: 1.2rem;
			font-weight: bold;
			color: var(--dark-blue);
		}

		.input-content,
		.input-url,
		.input-price {
			font-size: 1rem;
		}

		input {
			width: 100%;
			padding: 7px 9px;
			border: 1px solid #cfd8e3;
			border-radius: 4px;
			font-family: inherit;
		}

		.input-content {
			max-width: 120px;
		}

		.input-url {
			font-size: 0.85rem;
			color: #555;
		}

		.stock-controls {
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: 150px;
		}

		.btn-calc,
		.btn-delete {
			background-color: var(--dark-blue);
			color: var(--white);
			border: none;
			width: 40px;
			height: 40px;
			min-width: 40px;
			min-height: 40px;
			border-radius: 50%;
			font-size: 1.4rem;
			font-weight: bold;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
		}

		.btn-delete {
			background-color: var(--orange);
			font-size: 1rem;
		}

		.btn-add {
			background-color: var(--white);
			color: var(--dark-blue);
			border: 1px solid var(--white);
			border-radius: 4px;
			padding: 10px 16px;
			font-family: inherit;
			font-weight: bold;
			cursor: pointer;
		}

		.stock-num {
			font-size: 1.4rem;
			font-weight: bold;
			min-width: 35px;
			text-align: center;
		}

		.price-control {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 1.1rem;
		}

		.input-price {
			width: 80px;
			text-align: center;
		}

		.nav-btn {
			color: var(--white);
			text-decoration: none;
			font-size: 1.1rem;
			font-weight: 300;
			border: 1px solid var(--white);
			padding: 12px 28px;
			display: inline-block;
			margin-top: 5px;
		}

		.nav-btn:hover {
			background-color: var(--white);
			color: var(--portaal-blue);
		}

		.empty-message {
			padding: 22px 0;
			color: #666;
		}

		@media (max-width: 760px) {
			.row {
				grid-template-columns: 1fr;
			}

			.stock-controls {
				width: 150px;
			}
		}
	</style>
</head>
<body>
	<div class="admin-box">
		<h1>Voorraadbeheer</h1>
		<div id="beheer-lijst"></div>
		<a href="index.html" class="nav-btn">← Sluiten en opslaan</a>
	</div>
	<script>
		const BIN_ID = "6a25b47bda38895dfe95ebb6";
		const MASTER_KEY = "$2a$10$eqYsufkzs8q6iPB5R1Jtf.ux0kkigXJRMNuq/kY/SH.Q/ZONJsAde";
		const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

		const CATEGORY_LABELS = {
			drinks: "Frisdrank",
			snacks: "Snacks"
		};

		let products = { drinks: {}, snacks: {} };
		let saveTimeout;

		function normaliseerData(record) {
			if (record.drinks || record.snacks) {
				return {
					drinks: record.drinks || {},
					snacks: record.snacks || {}
				};
			}

			// Backwards compatible: oude JSON zonder categorieën wordt automatisch als frisdrank ingeladen.
			return {
				drinks: record || {},
				snacks: {}
			};
		}

		function escapeHtml(value) {
			return String(value ?? "")
				.replaceAll("&", "&amp;")
				.replaceAll("<", "&lt;")
				.replaceAll(">", "&gt;")
				.replaceAll('"', "&quot;")
				.replaceAll("'", "&#039;");
		}

		function escapeAttr(value) {
			return escapeHtml(value);
		}

		async function haalVoorraadOp() {
			const response = await fetch(BASE_URL + "/latest", {
				headers: {
					"X-Master-Key": MASTER_KEY
				}
			});

			const data = await response.json();
			products = normaliseerData(data.record || {});

			toonBeheer();
		}

		async function slaVoorraadOp() {
			await fetch(BASE_URL, {
				method: "PUT",
				headers: {
					"Content-Type": "application/json",
					"X-Master-Key": MASTER_KEY
				},
				body: JSON.stringify(products)
			});
		}

		function automatischOpslaan() {
			clearTimeout(saveTimeout);
			saveTimeout = setTimeout(slaVoorraadOp, 500);
		}

		function toonBeheer() {
			const lijst = document.getElementById("beheer-lijst");
			lijst.innerHTML = "";

			Object.keys(CATEGORY_LABELS).forEach(category => {
				const items = products[category] || {};
				let rows = "";

				Object.keys(items)
					.sort((a, b) =>
						(items[a].name || "").localeCompare(
							items[b].name || "",
							"nl",
							{ sensitivity: "base" }
						)
					)
					.forEach(id => {
						const product = items[id];

					rows += `
						<div class="row">
							<div class="product-fields">
								<input class="input-name" type="text" value="${escapeAttr(product.name || "")}" placeholder="Naam" onchange="wijzigNaam('${category}', '${id}', this.value)">
								<input class="input-content" type="text" value="${escapeAttr(product.content || "")}" placeholder="Inhoud / omschrijving" onchange="wijzigContent('${category}', '${id}', this.value)">
								<input class="input-url" type="text" value="${escapeAttr(product.img || "")}" placeholder="Afbeelding URL" onchange="wijzigAfbeelding('${category}', '${id}', this.value)">
							</div>

							<div class="stock-controls">
								<button class="btn-calc" onclick="wijzigVoorraad('${category}', '${id}', -1)">-</button>
								<span class="stock-num">${Number(product.stock || 0)}</span>
								<button class="btn-calc" onclick="wijzigVoorraad('${category}', '${id}', 1)">+</button>
							</div>

							<div class="price-control">
								<span>€</span>
								<input class="input-price" type="number" step="0.01" min="0" value="${Number(product.price || 0)}" onchange="wijzigPrijs('${category}', '${id}', this.value)">
							</div>

							<button class="btn-delete" title="Verwijderen" onclick="verwijderProduct('${category}', '${id}')">×</button>
						</div>
					`;
				});

				lijst.innerHTML += `
					<section class="category-block">
						<div class="category-header">
							<h2>${CATEGORY_LABELS[category]}</h2>
							<button class="btn-add" onclick="voegProductToe('${category}')">+ Product toevoegen</button>
						</div>
						<div class="beheer-container">
							${rows || `<div class="empty-message">Nog geen producten in deze categorie.</div>`}
						</div>
					</section>
				`;
			});
		}

		function wijzigNaam(category, id, naam) {
			products[category][id].name = naam;
			automatischOpslaan();
		}

		function wijzigContent(category, id, content) {
			products[category][id].content = content;
			automatischOpslaan();
		}

		function wijzigAfbeelding(category, id, url) {
			products[category][id].img = url;
			automatischOpslaan();
		}

		function wijzigPrijs(category, id, prijs) {
			products[category][id].price = parseFloat(prijs) || 0;
			automatischOpslaan();
		}

		function wijzigVoorraad(category, id, getal) {
			const huidig = Number(products[category][id].stock || 0);
			const nieuw = huidig + getal;

			if (nieuw < 0) return;

			products[category][id].stock = nieuw;
			toonBeheer();
			automatischOpslaan();
		}

		function voegProductToe(category) {
			const ids = Object.keys(products[category] || {}).map(Number).filter(Boolean);
			const nieuwId = String(ids.length ? Math.max(...ids) + 1 : 1);

			products[category][nieuwId] = {
				name: "Nieuw product",
				content: "",
				stock: 0,
				price: 0,
				img: ""
			};

			toonBeheer();
			automatischOpslaan();
		}

		function verwijderProduct(category, id) {
			if (!confirm("Weet je zeker dat je dit product wilt verwijderen?")) return;
			delete products[category][id];
			toonBeheer();
			automatischOpslaan();
		}

		window.onload = haalVoorraadOp;
	</script>
</body>
</html>
