<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voorraadbeheer</title>
    <style>
      :root {
        --portaal-blue: #5BC5F2;
        --dark-blue: #11275E;
        --orange: #E9530E;
        --white: #FFFFFF;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
        background: var(--portaal-blue);
        color: white;
        padding: 60px 20px;
      }

      .container {
        max-width: 900px;
        margin: auto;
      }

      h1 {
        font-size: 3rem;
        font-weight: 300;
        margin-bottom: 40px;
      }

      /* zelfde “kaart” stijl als index */
      .card {
        background: white;
        color: var(--dark-blue);
        border-top: 5px solid var(--dark-blue);
        padding: 20px;
        border-radius: 4px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      }

      .product-name {
        font-weight: bold;
        font-size: 1.1rem;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .btn-calc {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: var(--dark-blue);
        color: white;
        font-size: 20px;
        cursor: pointer;
      }

      .stock-num {
        font-size: 1.3rem;
        font-weight: bold;
        min-width: 40px;
        text-align: center;
      }

      .nav-btn {
        display: inline-block;
        margin-top: 30px;
        border: 1px solid white;
        padding: 12px 28px;
        color: white;
        text-decoration: none;
        transition: 0.2s;
      }

      .nav-btn:hover {
        background: white;
        color: var(--portaal-blue);
      }

      header {
        margin-bottom: 40px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Voorraadbeheer</h1>
      </header>
      <div id="beheer-lijst"></div>
      <a href="index.html" class="nav-btn">← Terug</a>
    </div>
    <script>
      const BIN_ID = "6a25b47bda38895dfe95ebb6";
      const MASTER_KEY = "$2a$10$eqYsufkzs8q6iPB5R1Jtf.ux0kkigXJRMNuq/kY/SH.Q/ZONJsAde";
      const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      let products = {};
      let saveTimeout;
      async function haalVoorraadOp() {
        const res = await fetch(BASE_URL + "/latest", {
          headers: {
            "X-Master-Key": API_KEY
          }
        });
        const data = await res.json();
        products = data.record;
        toonBeheer();
      }
      async function slaVoorraadOp() {
        await fetch(BASE_URL, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY
          },
          body: JSON.stringify(products)
        });
      }

      function toonBeheer() {
        const container = document.getElementById("beheer-lijst");
        container.innerHTML = "";
        Object.keys(products).forEach(name => {
          const p = products[name];
          container.innerHTML += `


					<div class="card">
						<div class="product-name">${name}</div>
						<div class="controls">
							<button class="btn-calc" onclick="wijzig('${name}',-1)">-</button>
							<div class="stock-num">${p.stock}</div>
							<button class="btn-calc" onclick="wijzig('${name}',1)">+</button>
						</div>
					</div>

`;
        });
      }

      function wijzig(name, delta) {
        const nieuw = products[name].stock + delta;
        if (nieuw < 0) return;
        products[name].stock = nieuw;
        toonBeheer();
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(slaVoorraadOp, 500);
      }
      window.onload = haalVoorraadOp;
    </script>
  </body>
</html>
